# CI runs the pre-commit hooks (the single list of checks, see .pre-commit-config.yaml) and the tests with the
# coverage threshold, as two parallel jobs. Both must be green before merging into main.
name: CI

# Every push to any branch; a PR's checks come from the push to its branch.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      # no-commit-to-branch guards local commits only; CI also runs on main after a merge.
      # The staged-only gitleaks hook would see nothing here; the next step scans the whole history instead.
      - name: pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,gitleaks

      - name: Secrets in the full history
        run: uv run pre-commit run --hook-stage manual gitleaks-history --all-files

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Fails under 90% branch coverage (fail_under in pyproject.toml).
      - name: Tests with coverage
        run: uv run pytest --cov
