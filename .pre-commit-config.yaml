# Install once with: uv run pre-commit install --install-hooks
# Ruff, mypy and pytest run from the project's venv (`uv run`), so their versions come from
# uv.lock and mypy sees the real installed dependencies.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: debug-statements
      # Work happens on a branch and lands through a PR (see CLAUDE.md).
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secrets such as an OPENAI_API_KEY, which detect-private-key (PEM keys only) misses.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # On commit: scans only the staged changes, so a secret is caught before it is committed.
      - id: gitleaks
      # On push, in CI, or by hand (`uv run pre-commit run --hook-stage manual --all-files`): scans the whole history.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [pre-push, manual]

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Whole project, not just the staged files: a change can break types elsewhere.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: import contracts
        entry: uv run lint-imports
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        require_serial: true

      # Every third-party import in src/ is a declared dependency, and every dependency is used.
      - id: deptry
        name: deptry
        entry: uv run deptry src
        language: system
        files: ^(src/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest with coverage threshold
        entry: uv run pytest -q --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
