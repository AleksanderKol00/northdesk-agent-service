[project]
name = "northdesk-ticket-agent"
version = "0.1.0"
description = "Resilient backend that processes Northdesk support tickets in several steps with an AI agent."
readme = "README.md"
authors = [
    { name = "Aleksander Kolowski", email = "kolowskialeksander@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "northdesk_ticket_agent.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "S",      # flake8-bandit: security
    "BLE",    # blind `except Exception`
    "ASYNC",  # blocking calls inside async code
    "SIM",    # simplifications
    "C4",     # comprehensions
    "PIE", "RET", "RUF",
    "PT",     # pytest style
]
ignore = ["SIM905"]  # "a b c".split() reads better than a long list literal

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
