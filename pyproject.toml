[project]
name = "northdesk-ticket-agent"
version = "0.1.0"
description = "Triages Northdesk support tickets with an LLM agent, checked rules and a Temporal workflow."
readme = "README.md"
authors = [
    { name = "Aleksander Kolowski", email = "kolowskialeksander@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "openai>=3.37.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "temporalio[opentelemetry]>=1.34.0",
]

[project.scripts]
northdesk-worker = "northdesk_ticket_agent.orchestration.worker:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "northdesk_ticket_agent.main:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "S",      # flake8-bandit: security
    "BLE",    # blind `except Exception`
    "ASYNC",  # blocking calls inside async code
    "SIM",    # simplifications
    "C4",     # comprehensions
    "PIE", "RET", "RUF",
    "PT",     # pytest style
    "TID",    # tidy imports
]
ignore = ["SIM905"]  # "a b c".split() reads better than a long list literal

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

# Measured with `uv run pytest --cov`; the pre-push hook fails below the threshold.
[tool.coverage.run]
source = ["northdesk_ticket_agent"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
# tests/ has no __init__.py files: name modules by their path from these roots instead.
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Package boundaries from CLAUDE.md, checked by `uv run lint-imports`.
[tool.importlinter]
root_packages = ["northdesk_ticket_agent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: main -> api -> orchestration -> agent -> services -> domain"
type = "layers"
layers = [
    "northdesk_ticket_agent.main",
    "northdesk_ticket_agent.api",
    "northdesk_ticket_agent.orchestration",
    "northdesk_ticket_agent.agent",
    "northdesk_ticket_agent.services",
    "northdesk_ticket_agent.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure business code"
type = "forbidden"
source_modules = ["northdesk_ticket_agent.domain"]
forbidden_modules = [
    "northdesk_ticket_agent.config",
    "fastapi",
    "starlette",
    "openai",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Only the OpenAI adapter talks to the OpenAI SDK"
type = "forbidden"
source_modules = [
    "northdesk_ticket_agent.main",
    "northdesk_ticket_agent.api",
    "northdesk_ticket_agent.agent",
    "northdesk_ticket_agent.domain",
    "northdesk_ticket_agent.services.datastore",
    "northdesk_ticket_agent.services.helpdesk",
    "northdesk_ticket_agent.services.fake_helpdesk",
    "northdesk_ticket_agent.services.llm.base",
    "northdesk_ticket_agent.services.llm.fake_client",
]
forbidden_modules = ["openai"]
allow_indirect_imports = true  # going through services.llm.factory is the point

[[tool.importlinter.contracts]]
name = "Temporal stays out of the agent, services and domain"
type = "forbidden"
source_modules = [
    "northdesk_ticket_agent.agent",
    "northdesk_ticket_agent.services",
    "northdesk_ticket_agent.domain",
]
forbidden_modules = ["temporalio"]
